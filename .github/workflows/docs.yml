name: Docs

# Construye la documentacion MkDocs y, SOLO si GitHub Pages esta
# realmente disponible en este repositorio, la publica.
#
# LIMITACION DE ENTORNO VERIFICADA (2026-09-04): GitHub Pages NO esta
# disponible aca. El repositorio es privado y el plan actual no lo
# habilita; Settings -> Pages muestra "Upgrade or make this repository
# public to enable Pages", y `GET /repos/<owner>/<repo>/pages` devuelve
# 404. La decision del proyecto es NO cambiar la visibilidad del
# repositorio ni el plan.
#
# Consecuencia de diseno: el deploy es OPCIONAL y se omite solo; el build
# es OBLIGATORIO. `mkdocs build --strict` sigue siendo el gate real de la
# documentacion: si un enlace queda roto o falta una pagina, este workflow
# falla igual, este Pages disponible o no. Lo que no puede pasar es que
# `main` quede en rojo por intentar publicar en una plataforma que este
# repositorio no tiene contratada.
#
# Cuando Pages este disponible (repo publico o plan que lo incluya), el
# paso "Detectar disponibilidad" lo nota solo y el job `deploy` empieza a
# ejecutarse sin tocar este archivo. Requisito humano en ese momento, una
# sola vez: Settings -> Pages -> Build and deployment -> Source = "GitHub
# Actions".
#
# Por que no `mkdocs gh-deploy`: publica empujando la rama `gh-pages`, lo
# que exige Source = "Deploy from a branch" y ademas requiere Pages igual.
# Ver docs/tecnica/validacion-mvp-produccion.md y
# runs/v1.0.0-producto/16-validacion-mvp-produccion/decision.md.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]
  # Permite construir la documentacion a demanda desde cualquier rama sin
  # esperar a un push a `main`. No publica nada por si solo: el deploy
  # sigue condicionado a que Pages exista.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue de Pages a la vez. No se cancela el que esta en
# curso: interrumpir un deploy a mitad puede dejar el sitio inconsistente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_disponible: ${{ steps.pages.outputs.disponible }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      # GATE OBLIGATORIO. No depende de Pages ni de ninguna condicion:
      # si la documentacion no compila en modo estricto, el workflow falla.
      - name: Construir sitio (strict)
        run: mkdocs build --strict --site-dir ./site

      # El sitio queda descargable desde la pestana de la corrida aunque
      # no haya Pages. Es el reemplazo practico de la publicacion mientras
      # la limitacion de entorno siga vigente.
      - name: Publicar sitio como artefacto de la corrida
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mkdocs-site
          path: ./site
          retention-days: 14

      # Cualquier resultado que no sea un 200 de la API de Pages se trata
      # como "no disponible": 404 (no habilitado), 403 (plan que no lo
      # incluye) o un fallo de red. El paso nunca hace fallar al job, y si
      # no llega a escribir su salida, el valor vacio tambien omite el
      # deploy. El default seguro es NO publicar.
      - name: Detectar disponibilidad de GitHub Pages
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages disponible: se publicara el sitio."
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages no esta disponible en este repositorio (privado, plan actual). El sitio se construyo en modo estricto y quedo como artefacto 'mkdocs-site'; se omite el deploy a proposito. Ver docs/tecnica/validacion-mvp-produccion.md."
          fi

  # Job opcional. Con Pages no disponible queda `skipped`, y un job
  # omitido NO pone la corrida en rojo.
  deploy:
    needs: build
    if: needs.build.outputs.pages_disponible == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperar el sitio construido
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mkdocs-site
          path: ./site

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Empaquetar artefacto de Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
